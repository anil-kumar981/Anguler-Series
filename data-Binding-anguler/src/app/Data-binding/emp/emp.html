<div class="container">
  <h1>Angular Data Binding Examples</h1>

  <!-- 1️⃣ One-Way Data Binding -->
  <div class="card">
    <h2>One-Way Binding</h2>
    <p>Welcome, {{ userName }}</p>
    <input type="text" value="{{userName}}" />
    <img [src]="imageUrl" width="100" />
    <!-- when we use like this src="{{imageUrl}}" this static Binding , but if we use like this [src]="imageUrl" this Dynamic Binding -->
    <!-- passing value from parent to child in one way is done using function -->
    <button (click)="showPassedValue('Anil')">Show Passed Value</button>
  </div>

  <!-- 2️⃣ Two-Way Binding =Done using [(ngModel)] and we need to import FormsModule, this is used where user only for user input -->
  <div class="card">
    <h2>Two-Way Binding</h2>
    <input [(ngModel)]="userInput" placeholder="Type here" />
    <p>You typed: {{ userInput }}</p>
    <select [(ngModel)]="selectedOption">
      <option value="1">Option 1</option>
      <option value="2">Option 2</option>
      <option value="3">Option 3</option>
    </select>
  </div>

  <!-- 3️⃣ Event Binding -->

    <h2>Event Binding</h2>
    <button (click)="increment()">Click Me</button>
    <p>Button clicked: {{ count }} times</p>
  </div> -->
</div>
